<!DOCTYPE html>
<html lang="zh-CN" data-ui-version="popup-p0">
<head>
  <meta charset="UTF-8">
  <title>TimeOnChrome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f0faf6;
      --card: #ffffff;
      --border: rgba(0, 184, 148, 0.12);
      --text: #1a2e25;
      --muted: #6b8a7a;
      --accent: #00b894;
      --green: #00b894;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      padding: 0;
    }

    .header {
      padding: 16px 20px 12px;
      background: linear-gradient(135deg, rgba(0,184,148,0.12) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #00b894, #00cba9);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 14px; font-weight: 700; }
    .header-text p  { font-size: 11px; color: var(--muted); }

    .header-right {
      display: flex;
      align-items: center;
    }

    .settings-btn {
      width: 28px; height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: background 0.2s;
    }
    .settings-btn:hover { background: rgba(0,184,148,0.08); }

    .body { padding: 12px 16px; }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 10px;
      margin-top: 14px;
    }
    .section-title:first-child { margin-top: 0; }

    .mode-bar {
      margin: 12px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mode-btn {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(0,184,148,0.04);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      text-align: left;
    }
    .mode-btn-label { font-size: 12px; }
    .mode-btn-value { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 10px; white-space: nowrap; }
    .mode-btn.active-study {
      background: rgba(0,184,148,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }
    .mode-btn.active-rest {
      background: rgba(251,191,36,0.12);
      border-color: var(--warn);
      color: var(--warn);
    }
    .mode-btn.active-composite {
      background: rgba(108,92,231,0.12);
      border-color: #6c5ce7;
      color: #6c5ce7;
    }
    .mode-btn.active-study .mode-btn-value { color: var(--accent); }
    .mode-btn.active-rest .mode-btn-value { color: var(--warn); }
    .mode-btn.active-composite .mode-btn-value { color: #6c5ce7; }

    .runtime-compact {
      margin: 8px 16px 0;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress Bars */
    .quota-bar-item { margin-bottom: 12px; }
    .quota-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .quota-bar-label { font-size: 12px; font-weight: 500; }
    .quota-bar-value { font-size: 11px; color: var(--muted); }
    .progress-track {
      height: 6px;
      background: rgba(0,184,148,0.08);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.5s;
    }

    /* Top 10 */
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--card);
      border-radius: 8px;
      margin-bottom: 5px;
      border: 1px solid var(--border);
    }
    .stat-row-left  { font-size: 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:8px; }
    .stat-row-right { font-size: 11px; color: var(--accent); font-weight: 600; white-space:nowrap; }

    .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-icon">⏱</div>
      <div class="header-text">
        <h1>TimeOnChrome</h1>
        <p id="child-name-header">我的时间</p>
      </div>
    </div>
    <div class="header-right">
      <button id="settings-btn" class="settings-btn" title="设置">⚙️</button>
    </div>
  </div>

  <div id="unbound-banner" style="display:none;margin:12px 16px 0;background:#fff8f8;border:1px solid rgba(239,68,68,0.2);border-left:3px solid #ef4444;border-radius:10px;padding:12px 14px;">
    <div style="font-size:13px;font-weight:600;color:#ef4444;margin-bottom:4px;">⚠️ 设备未绑定</div>
    <div style="font-size:12px;color:#6b8a7a;line-height:1.6;">此设备尚未绑定孩子档案，请联系家长完成设备绑定。</div>
    <div style="margin-top:10px;">
      <span id="goto-admin-btn" style="font-size:12px;color:var(--muted);padding:4px 0;">查看详情</span>
    </div>
  </div>

  <div id="popup-content">
    <div class="mode-bar">
      <button class="mode-btn" id="btn-study">
        <span class="mode-btn-label">📚 学习模式</span>
        <span class="mode-btn-value" id="btn-study-value">0秒</span>
      </button>
      <button class="mode-btn" id="btn-rest">
        <span class="mode-btn-label">☕ 休息模式</span>
        <span class="mode-btn-value" id="btn-rest-value">0秒</span>
      </button>
      <button class="mode-btn" id="btn-composite">
        <span class="mode-btn-label">🧩 综合模式</span>
        <span class="mode-btn-value" id="btn-composite-value">0秒</span>
      </button>
    </div>

    <div class="body">
    <!-- Progress Bars (Online + Undetermined + Backend Media) -->
    <div id="quota-bars">
      <div class="empty">加载中...</div>
    </div>
    <div id="backend-media-row" style="display:none;margin-top:8px;font-size:12px;color:var(--muted);">
      🎵 后台音视频  <span id="backend-media-value" style="color:var(--text);font-weight:600;">0分钟</span>
    </div>

    <div class="runtime-compact" id="runtime-compact">当前：暂无 · 0秒</div>

    <!-- Top 10 -->
    <div class="section-title">今日访问</div>
    <div id="today-top10"><div class="empty">暂无数据</div></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
