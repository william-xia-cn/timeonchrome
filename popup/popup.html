<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TimeOnChrome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #09090f;
      --card: #131325;
      --border: rgba(255,255,255,0.07);
      --text: #e2e2f0;
      --muted: #5a5a80;
      --accent: #7c6fff;
      --green: #4ade80;
      --warn: #fbbf24;
      --danger: #f87171;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      padding: 0;
    }

    .header {
      padding: 16px 20px 12px;
      background: linear-gradient(135deg, rgba(124,111,255,0.15) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #9c6fff);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 14px; font-weight: 700; }
    .header-text p  { font-size: 11px; color: var(--muted); }

    /* 激励文字卡 */
    .summary-card {
      margin: 12px 16px 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
    }

    .body { padding: 12px 16px; }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 10px;
      margin-top: 14px;
    }
    .section-title:first-child { margin-top: 0; }

    /* 进度条组 */
    .quota-bar-item {
      margin-bottom: 12px;
    }
    .quota-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .quota-bar-label { font-size: 12px; font-weight: 500; }
    .quota-bar-value { font-size: 11px; color: var(--muted); }
    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.5s;
    }

    /* Top 5 */
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--card);
      border-radius: 8px;
      margin-bottom: 5px;
      border: 1px solid var(--border);
    }
    .stat-row-left  { font-size: 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:8px; }
    .stat-row-right { font-size: 11px; color: var(--accent); font-weight: 600; white-space:nowrap; }

    .footer {
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-date { font-size: 10px; color: var(--muted); }
    .detail-link {
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .detail-link:hover { color: var(--text); }

    .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🛡</div>
    <div class="header-text">
      <h1>TimeOnChrome</h1>
      <p id="child-name-header">我的时间</p>
    </div>
  </div>

  <!-- 激励摘要 -->
  <div class="summary-card" id="summary-card">加载中...</div>

  <div class="body">
    <!-- 今日用量进度条 -->
    <div class="section-title">今日用量</div>
    <div id="quota-bars">
      <div class="empty">加载中...</div>
    </div>

    <!-- 今日 Top5 -->
    <div class="section-title">今日访问</div>
    <div id="today-top5"><div class="empty">暂无数据</div></div>
  </div>

  <div class="footer">
    <span class="footer-date" id="footer-date"></span>
    <a class="detail-link" id="detail-link">📊 详情</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
