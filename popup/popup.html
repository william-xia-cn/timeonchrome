<!DOCTYPE html>
<html lang="zh-CN" data-ui-version="popup-p0">
<head>
  <meta charset="UTF-8">
  <title>TimeOnChrome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f0faf6;
      --card: #ffffff;
      --border: rgba(0, 184, 148, 0.12);
      --text: #1a2e25;
      --muted: #6b8a7a;
      --accent: #00b894;
      --green: #00b894;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      padding: 0;
    }

    .header {
      padding: 16px 20px 12px;
      background: linear-gradient(135deg, rgba(0,184,148,0.12) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #00b894, #00cba9);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 14px; font-weight: 700; }
    .header-text p  { font-size: 11px; color: var(--muted); }

    .header-right {
      display: flex;
      align-items: center;
    }

    .settings-btn {
      width: 28px; height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: background 0.2s;
    }
    .settings-btn:hover { background: rgba(0,184,148,0.08); }

    .body { padding: 12px 16px; }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 10px;
      margin-top: 14px;
    }
    .section-title:first-child { margin-top: 0; }

    .mode-bar {
      margin: 10px 16px 0;
      display: flex;
      gap: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(0,184,148,0.04);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active-study {
      background: rgba(0,184,148,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }
    .mode-btn.active-rest {
      background: rgba(251,191,36,0.12);
      border-color: var(--warn);
      color: var(--warn);
    }

    /* Current Site */
    .current-site {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .current-site-domain {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .current-site-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 100px;
      font-weight: 600;
    }
    .badge-study { background: rgba(0,184,148,0.12); color: var(--accent); }
    .badge-rest { background: rgba(239,68,68,0.12); color: var(--danger); }
    .badge-composite { background: rgba(108,92,231,0.12); color: #6c5ce7; }
    .badge-unknown { background: rgba(107,138,122,0.12); color: var(--muted); }

    /* Stats Cards */
    .stats-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }
    .stat-card-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .stat-card-label {
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Progress Bars */
    .quota-bar-item { margin-bottom: 12px; }
    .quota-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .quota-bar-label { font-size: 12px; font-weight: 500; }
    .quota-bar-value { font-size: 11px; color: var(--muted); }
    .progress-track {
      height: 6px;
      background: rgba(0,184,148,0.08);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.5s;
    }

    /* Top 10 */
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--card);
      border-radius: 8px;
      margin-bottom: 5px;
      border: 1px solid var(--border);
    }
    .stat-row-left  { font-size: 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:8px; }
    .stat-row-right { font-size: 11px; color: var(--accent); font-weight: 600; white-space:nowrap; }

    .actions {
      padding: 10px 16px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }
    .action-link {
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .action-link:hover { color: var(--text); }

    .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-icon">⏱</div>
      <div class="header-text">
        <h1>TimeOnChrome</h1>
        <p id="child-name-header">我的时间</p>
      </div>
    </div>
    <div class="header-right">
      <button id="settings-btn" class="settings-btn" title="设置">⚙️</button>
    </div>
  </div>

  <div id="unbound-banner" style="display:none;margin:12px 16px 0;background:#fff8f8;border:1px solid rgba(239,68,68,0.2);border-left:3px solid #ef4444;border-radius:10px;padding:12px 14px;">
    <div style="font-size:13px;font-weight:600;color:#ef4444;margin-bottom:4px;">⚠️ 设备未绑定</div>
    <div style="font-size:12px;color:#6b8a7a;line-height:1.6;">此设备已被解绑，请前往管理面板重新绑定。</div>
    <div style="margin-top:10px;">
      <a id="goto-admin-btn" style="font-size:12px;color:#00b894;cursor:pointer;text-decoration:none;border:1px solid rgba(0,184,148,0.3);padding:4px 12px;border-radius:6px;">前往管理面板 →</a>
    </div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn" id="btn-study">📚 学习模式</button>
    <button class="mode-btn" id="btn-rest">☕ 休息模式</button>
  </div>

  <div class="body">
    <!-- Current Site -->
    <div class="section-title">正在访问</div>
    <div id="current-site" class="current-site">
      <div class="current-site-domain" id="current-domain">—</div>
      <span id="current-badge" class="current-site-badge badge-unknown">未知</span>
    </div>

    <!-- Progress Bars (Online + Undetermined + Backend Media) -->
    <div class="section-title">今日用量</div>
    <div id="quota-bars">
      <div class="empty">加载中...</div>
    </div>
    <div id="backend-media-row" style="display:none;margin-top:8px;font-size:12px;color:var(--muted);">
      🎵 后台音视频  <span id="backend-media-value" style="color:var(--text);font-weight:600;">0分钟</span>
    </div>

    <!-- Top 10 -->
    <div class="section-title">今日访问</div>
    <div id="today-top10"><div class="empty">暂无数据</div></div>
  </div>

  <div class="actions">
    <a class="action-link" id="detail-link">📊 详情</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
