<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扩展模块 · TimeOnChrome</title><style>body{margin:0;background:#f4f8f7;color:#172a26;font-family:Arial,"Microsoft YaHei",sans-serif}main{max-width:900px;margin:auto;padding:40px 20px}a{color:#176b5f}h1{margin:28px 0 6px}.sub{color:#617873}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:24px}.card{display:block;background:#fff;border:1px solid #d8e7e3;border-radius:8px;padding:18px;text-decoration:none;color:inherit}.card:hover{border-color:#008f7a}.card strong{display:block;margin-bottom:8px}.empty{padding:30px;background:#fff;border:1px solid #d8e7e3}</style></head><body><main><a href="/">返回家长控制台</a><h1>扩展模块</h1><p class="sub">独立模块拥有自己的配置、状态和运行边界。</p><div id="modules" class="grid"></div></main><script>fetch('/optional-modules.json').then(r=>r.json()).then(items=>{const root=document.getElementById('modules');if(!items.length){root.innerHTML='<div class="empty">当前没有可用模块</div>';return}for(const item of items){const a=document.createElement('a');a.className='card';a.href=item.href;const strong=document.createElement('strong');strong.textContent=item.label;const span=document.createElement('span');span.textContent=item.description||'';a.append(strong,span);root.append(a)}}).catch(()=>document.getElementById('modules').innerHTML='<div class="empty">模块目录暂不可用</div>')</script></body></html>
