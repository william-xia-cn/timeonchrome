<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeOnChrome - 设备绑定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 24px; color: #1d1d1f; margin-bottom: 8px; }
    .subtitle { color: #86868b; font-size: 14px; margin-bottom: 24px; }
    
    .step { display: none; }
    .step.active { display: block; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #1d1d1f; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #00b894; }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00b894, #00cba9);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #d2d2d7; cursor: not-allowed; }
    
    .error { color: #ff3b30; font-size: 13px; margin-top: 8px; display: none; }
    .error.show { display: block; }
    
    .profiles { margin-top: 16px; }
    .profile-item {
      padding: 12px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-item:hover { border-color: #00b894; background: #f0faf6; }
    .profile-item.selected { border-color: #00b894; background: #f0faf6; }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
    }
    .profile-name { font-size: 15px; color: #1d1d1f; }
    
    .success { 
      text-align: center; 
      padding: 40px 0;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      background: #34c759;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    .success-icon.warning {
      background: #ff9500;
      font-size: 28px;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #86868b;
    }
    .welcome-banner {
      background: linear-gradient(135deg, rgba(0,184,148,0.1), rgba(0,203,169,0.06));
      border: 1px solid rgba(0,184,148,0.25);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #00836a;
      line-height: 1.6;
    }
    .welcome-banner strong { display: block; font-size: 15px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TimeOnChrome</h1>
    <p class="subtitle">设备绑定</p>
    
    <!-- 欢迎引导（仅首次安装时显示） -->
    <div id="welcomeBanner" class="welcome-banner" style="display:none">
      <strong>欢迎使用 TimeOnChrome 👋</strong>
      三步完成设置：① 登录家长账号 &nbsp;② 选择孩子档案 &nbsp;③ 绑定此设备
    </div>

    <!-- Step 1: 登录 -->
    <div id="step1" class="step active">
      <div class="form-group">
        <label>家长邮箱</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="密码">
      </div>
      <button id="btnLogin">登录</button>
      <p class="error" id="error1"></p>
    </div>
    
    <!-- Step 2: 选择孩子 -->
    <div id="step2" class="step">
      <p style="margin-bottom: 16px; color: #1d1d1f;">选择这台设备属于哪个孩子：</p>
      <div class="profiles" id="profilesList"></div>
      <p class="error" id="error2"></p>
    </div>
    
    <!-- Step 3: 绑定成功 -->
    <div id="step3" class="step">
      <div class="success">
        <div class="success-icon" id="successIcon">✓</div>
        <h2 style="margin-bottom: 8px;" id="successTitle">绑定成功！</h2>
        <p style="color: #86868b;" id="successMsg">设备已成功绑定，现在可以开始使用 TimeOnChrome。</p>
      </div>
    </div>
    
    <!-- Loading -->
    <div id="loading" class="step">
      <div class="loading">处理中...</div>
    </div>
  </div>
  
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="bind.js"></script>
</body>
</html>
