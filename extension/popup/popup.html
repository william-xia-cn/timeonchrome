<!DOCTYPE html>
<html lang="zh-CN" data-ui-version="popup-p0">
<head>
  <meta charset="UTF-8">
  <title>TimeOnChrome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f0faf6;
      --card: #ffffff;
      --border: rgba(0, 184, 148, 0.12);
      --text: #1a2e25;
      --muted: #6b8a7a;
      --accent: #00b894;
      --green: #00b894;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      padding: 0;
    }

    .header {
      padding: 16px 20px 12px;
      background: linear-gradient(135deg, rgba(0,184,148,0.12) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #00b894, #00cba9);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .header-text h1 { font-size: 14px; font-weight: 700; }
    .header-text p  { font-size: 11px; color: var(--muted); }

    .header-right {
      display: flex;
      align-items: center;
    }

    .settings-btn {
      width: 28px; height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: background 0.2s;
    }
    .settings-btn:hover { background: rgba(0,184,148,0.08); }

    .body { padding: 12px 16px; }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 10px;
      margin-top: 14px;
    }
    .section-title:first-child { margin-top: 0; }

    .mode-bar {
      margin: 12px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mode-btn {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(0,184,148,0.04);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.25;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      text-align: left;
    }
    .mode-btn-label { font-size: 12px; }
    .mode-btn-value { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 10px; white-space: nowrap; }
    .mode-btn.active-study {
      background: rgba(0,184,148,0.12);
      border-color: var(--accent);
      color: var(--accent);
    }
    .mode-btn.active-rest {
      background: rgba(251,191,36,0.12);
      border-color: var(--warn);
      color: var(--warn);
    }
    .mode-btn.active-composite {
      background: rgba(108,92,231,0.12);
      border-color: #6c5ce7;
      color: #6c5ce7;
    }
    .mode-btn.active-study .mode-btn-value { color: var(--accent); }
    .mode-btn.active-rest .mode-btn-value { color: var(--warn); }
    .mode-btn.active-composite .mode-btn-value { color: #6c5ce7; }

    .runtime-compact {
      margin: 10px 16px 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0,184,148,0.04);
      display: none;
    }
    .runtime-compact-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 0;
    }
    .runtime-compact-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      margin-top: 4px;
    }
    .runtime-domain {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }
    .runtime-tag {
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .runtime-duration {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .request-entry {
      margin: 8px 16px 0;
      display: flex;
      justify-content: flex-end;
    }
    .request-open-btn {
      border: 1px solid rgba(108,92,231,0.22);
      background: rgba(108,92,231,0.08);
      color: #5747d1;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
    }
    .request-panel {
      margin: 8px 16px 0;
      padding: 10px;
      border: 1px solid rgba(108,92,231,0.18);
      border-radius: 9px;
      background: rgba(255,255,255,0.7);
    }
    .request-panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 5px;
    }
    .request-help {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .request-input {
      width: 100%;
      min-height: 58px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 8px;
      background: var(--card);
      color: var(--text);
      font-size: 11px;
      line-height: 1.45;
      outline: none;
      resize: vertical;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .request-actions {
      display: flex;
      gap: 7px;
      margin-top: 8px;
    }
    .request-actions button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 11px;
      cursor: pointer;
    }
    .request-submit {
      background: #6c5ce7;
      border-color: #6c5ce7 !important;
      color: #fff;
      font-weight: 650;
    }
    .request-back { background: transparent; color: var(--muted); }
    .request-status {
      display: none;
      margin-top: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.72);
      font-size: 11px;
      line-height: 1.5;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .request-status.ok {
      display: block;
      color: #047857;
      border-color: rgba(0,184,148,0.24);
      background: rgba(0,184,148,0.08);
    }
    .request-status.err {
      display: block;
      color: var(--danger);
      border-color: rgba(214,48,49,0.22);
      background: rgba(214,48,49,0.07);
    }
    .request-status-title {
      font-size: 12px;
      font-weight: 750;
      color: inherit;
    }
    .request-status-body,
    .request-status-target,
    .request-status-extra {
      margin-top: 4px;
    }
    .request-status-target {
      color: var(--text);
    }

    .usage-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .usage-panel-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }
    .usage-metric {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255,255,255,0.58);
      padding: 9px 10px;
    }
    .usage-metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .usage-metric-label {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 12px;
      font-weight: 650;
      color: var(--text);
    }
    .usage-metric-icon { width: 18px; text-align: center; flex-shrink: 0; }
    .usage-metric-value {
      font-size: 12px;
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .usage-metric-sub {
      margin-top: 3px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.4;
    }
    .usage-metric.locked .usage-metric-value { color: var(--danger); }
    .usage-metric.locked .usage-metric-sub { color: var(--danger); }
    .progress-track {
      height: 5px;
      background: rgba(0,184,148,0.08);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.5s;
    }

    .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-icon">⏱</div>
      <div class="header-text">
        <h1>TimeOnChrome</h1>
        <p id="child-name-header">我的时间</p>
      </div>
    </div>
    <div class="header-right">
      <button id="settings-btn" class="settings-btn" title="设置">⚙️</button>
    </div>
  </div>

  <div id="unbound-banner" style="display:none;margin:12px 16px 0;background:#fffdf5;border:1px solid rgba(245,158,11,0.22);border-left:3px solid #f59e0b;border-radius:10px;padding:12px 14px;">
    <div style="font-size:13px;font-weight:600;color:#92400e;margin-bottom:4px;">本地模式</div>
    <div style="font-size:12px;color:#6b8a7a;line-height:1.6;">本地模式：未绑定云端，统计不会同步</div>
    <div style="margin-top:10px;">
      <button id="goto-admin-btn" style="border:0;background:transparent;color:var(--muted);padding:4px 0;font-size:12px;cursor:pointer;">打开管理中心</button>
    </div>
  </div>

  <div id="popup-content">
    <div class="runtime-compact" id="runtime-compact"></div>
    <div class="request-entry" id="site-request-entry">
      <button class="request-open-btn" id="site-request-open-btn">申请网站归类</button>
    </div>
    <div class="request-panel" id="site-request-panel" style="display:none;">
      <div class="request-panel-title">申请网站归类</div>
      <div class="request-help">仅适用于未归类网站。提交申请后可先临时使用，审批前按综合时长计入。家长之后可批准为学习网站或综合网站，也可以拒绝。提交申请后，可以在管理页面的访问规则中查看相关申请及批复情况。</div>
      <textarea class="request-input" id="site-request-input" rows="3" placeholder="输入域名、子域名或 https:// 链接"></textarea>
      <div class="request-status" id="site-request-status"></div>
      <div class="request-actions">
        <button class="request-submit" id="site-request-submit-btn">提交申请</button>
        <button class="request-back" id="site-request-back-btn">返回</button>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn" id="btn-study">
        <span class="mode-btn-label">📚 学习模式</span>
        <span class="mode-btn-value" id="btn-study-value">0秒</span>
      </button>
      <button class="mode-btn" id="btn-rest">
        <span class="mode-btn-label">☕ 休息模式</span>
        <span class="mode-btn-value" id="btn-rest-value">0秒</span>
      </button>
      <button class="mode-btn" id="btn-composite">
        <span class="mode-btn-label">🧩 综合模式</span>
        <span class="mode-btn-value" id="btn-composite-value">0秒</span>
      </button>
    </div>

    <div class="body">
    <!-- Usage metrics -->
    <div id="quota-bars">
      <div class="empty">加载中...</div>
    </div>
    <div id="suspect-segments-row" style="display:none;margin-top:8px;font-size:12px;color:var(--warn);line-height:1.5;">
      ⚠️ 历史异常计时 <span id="suspect-segments-value" style="color:var(--text);font-weight:600;">0段</span>
      <div style="font-size:11px;color:var(--muted);">可在管理中心标记后从本地统计排除</div>
    </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
