<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提醒 - TimeOnChrome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0faf6;
      --card: #ffffff;
      --border: rgba(0, 184, 148, 0.12);
      --text: #1a2e25;
      --muted: #6b8a7a;
      --accent: #00b894;
      --green: #00b894;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: left;
      padding: 30px 28px 24px;
      max-width: 560px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 184, 148, 0.16);
      border-radius: 14px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(7px);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .brand-mark .dot {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-mark .dot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, rgba(0, 184, 148, 0.2), rgba(0, 184, 148, 0.07));
      border: 1px solid rgba(0, 184, 148, 0.22);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 16px;
    }
    .icon-box img,
    .toc-ui-icon {
      width: 30px;
      height: 30px;
      display: inline-block;
      object-fit: contain;
      vertical-align: -6px;
    }
    .toc-ui-icon.small {
      width: 16px;
      height: 16px;
      vertical-align: -3px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .rest-quota-line {
      display: none;
      margin-bottom: 18px;
      font-size: 14px;
      color: var(--text);
      background: rgba(0, 184, 148, 0.09);
      border: 1px solid rgba(0, 184, 148, 0.2);
      border-radius: 8px;
      padding: 10px 12px;
      font-variant-numeric: tabular-nums;
    }

    .domain-name {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: var(--accent);
      background: rgba(0, 184, 148, 0.08);
      padding: 4px 14px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 18px;
    }

    .task-summary {
      display: none;
      font-size: 13px;
      color: var(--text);
      background: rgba(108,92,231,0.06);
      border: 1px solid rgba(108,92,231,0.18);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .task-summary strong { color: #5747d1; }

    .custom-msg {
      font-size: 13px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      justify-content: flex-start;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
      line-height: 1.4;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: #00a884;
      box-shadow: 0 2px 8px rgba(0, 184, 148, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(0, 184, 148, 0.25);
      background: rgba(0, 184, 148, 0.04);
    }
    .btn-secondary:hover {
      background: rgba(0, 184, 148, 0.1);
    }

    .btn-back {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-back:hover {
      background: rgba(0, 184, 148, 0.06);
      color: var(--text);
    }

    #statusFeedback {
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
      margin-bottom: 24px;
      transition: opacity 0.3s;
    }
    #statusFeedback.success { color: var(--accent); }
    #statusFeedback.error { color: var(--danger); }

    .slide-confirm-wrap {
      display: none;
      margin: 8px 0 14px;
      max-width: 100%;
      text-align: left;
    }

    .slide-hint {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 0;
      text-align: left;
      display: none;
    }

    .slide-track {
      position: relative;
      height: 50px;
      border-radius: 25px;
      background: rgba(0, 184, 148, 0.14);
      border: 1px solid rgba(0, 184, 148, 0.22);
      overflow: hidden;
    }

    .slide-track-label {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(15, 23, 42, 0.58);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
    }

    .slide-track-target {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 88px;
      border-left: 1px dashed rgba(0, 184, 148, 0.28);
      background: linear-gradient(90deg, rgba(0, 184, 148, 0.03), rgba(0, 184, 148, 0.14));
      pointer-events: none;
    }

    .slide-track::after {
      content: '确认区';
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(0, 184, 148, 0.72);
      font-size: 12px;
      font-weight: 600;
    }

    .slide-thumb {
      position: absolute;
      left: 0;
      top: 1px;
      width: 146px;
      height: 46px;
      line-height: 46px;
      text-align: center;
      border-radius: 23px;
      background: linear-gradient(135deg, #00b894, #00c7a1);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      user-select: none;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 8px 16px rgba(0, 184, 148, 0.34);
      z-index: 2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    .footer {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .footer span { color: rgba(0, 184, 148, 0.7); }

    body.study-rest-reminder .domain-name,
    body.study-rest-reminder .custom-msg {
      display: none !important;
    }

    body.study-rest-reminder .actions {
      margin-top: 4px;
      margin-bottom: 10px;
    }

    body.study-rest-reminder .container {
      display: flex;
      flex-direction: column;
    }

    body.study-rest-reminder .slide-confirm-wrap {
      order: 7;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    body.study-rest-reminder .dual-path-section {
      order: 8;
      margin-top: 10px;
      margin-bottom: 6px;
    }
    body.study-rest-reminder .slide-confirm-wrap-composite {
      order: 9;
      margin-top: 6px;
      margin-bottom: 8px;
    }
    body.study-rest-reminder .actions {
      order: 10;
      margin-top: 12px;
      margin-bottom: 0;
      justify-content: stretch;
      width: 100%;
    }

    body.study-rest-reminder .btn-back {
      width: 100%;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #d7dce5;
      background: #ffffff;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      box-shadow: none;
      padding: 0 14px;
      text-decoration: none;
      justify-content: center;
    }

    body.study-rest-reminder .btn-back:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #334155;
    }

    body.study-rest-reminder .btn-back:active {
      background: #f1f5f9;
    }

    body.study-rest-reminder h1 {
      font-size: 29px;
    }

    body.study-rest-reminder .subtitle {
      max-width: 95%;
    }

    body.study-rest-reminder .icon-box {
      margin-left: auto;
      margin-right: auto;
    }

    body.confirm-standard .domain-name,
    body.confirm-standard .custom-msg {
      display: none !important;
    }

    body.confirm-standard .icon-box {
      margin-left: auto;
      margin-right: auto;
    }

    body.confirm-standard .actions {
      margin-top: 12px;
      margin-bottom: 0;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    body.confirm-standard .btn {
      height: 40px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      justify-content: center;
      line-height: 1;
      padding: 0 12px;
    }

    body.confirm-standard .btn-primary {
      box-shadow: none;
    }

    body.confirm-standard .btn-back {
      background: #ffffff;
      border: 1px solid #d7dce5;
      color: #334155;
      text-decoration: none;
    }

    body.confirm-standard .btn-back:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #334155;
    }

    body.confirm-standard .btn-back:active {
      background: #f1f5f9;
    }

    body.study-rest-reminder .footer,
    body.study-rest-reminder #statusFeedback {
      display: none !important;
    }

    /* Dual-path slider styles for study_mode (Case #5/#6) */
    .dual-path-section {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
    }
    .dual-path-section .path-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .dual-path-section .path-body {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .slide-confirm-wrap-composite {
      display: none;
      margin: 8px 0 14px;
      max-width: 100%;
      text-align: left;
    }
    .slide-confirm-wrap-composite .slide-track {
      background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.22);
    }
    .slide-confirm-wrap-composite .slide-track-target {
      border-left: 1px dashed rgba(99, 102, 241, 0.28);
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.03), rgba(99, 102, 241, 0.14));
    }
    .slide-confirm-wrap-composite .slide-track::after {
      content: '确认区';
      color: rgba(99, 102, 241, 0.72);
    }
    .slide-confirm-wrap-composite .slide-thumb {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.34);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
    }
    body.study-rest-reminder .slide-confirm-wrap {
      order: 7;
      margin-top: 6px;
      margin-bottom: 8px;
    }
    body.study-rest-reminder .dual-path-section {
      order: 8;
      margin-top: 10px;
      margin-bottom: 6px;
    }
    body.study-rest-reminder .slide-confirm-wrap-composite {
      order: 9;
      margin-top: 6px;
      margin-bottom: 8px;
    }
    body.study-rest-reminder .actions {
      order: 10;
      margin-top: 12px;
      margin-bottom: 0;
      justify-content: stretch;
      width: 100%;
    }

    @media (max-width: 640px) {
      .container {
        padding: 24px 18px 20px;
      }
      h1,
      body.study-rest-reminder h1 {
        font-size: 24px;
      }
      .slide-track-label {
        left: 14px;
      }
      .slide-track-target {
        width: 78px;
      }
      .slide-thumb {
        width: 136px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-mark"><span class="dot"><img src="icons/app-icon.png" alt="TimeOnChrome"></span>TimeOnChrome</div>
    <div class="icon-box" id="mainIcon"><img src="icons/ui/blocked.svg" alt=""></div>

    <h1 id="mainTitle">此网站不适合访问</h1>
    <p class="subtitle" id="subtitle">基于年龄和安全考虑，建议不要访问此类网站</p>
    <div class="rest-quota-line" id="restQuotaLine"></div>
    <div class="domain-name" id="domainEl">-</div>

    <div class="task-summary" id="taskSummary"></div>
    <div class="custom-msg" id="customMsg" style="display: none;"></div>

    <div class="actions" id="actions">
      <button class="btn btn-back" id="fallback-back-btn">返回学习</button>
    </div>

    <div class="slide-confirm-wrap" id="slideConfirmWrap">
      <div class="slide-hint" id="slideHint">确认进入休息时间</div>
      <div class="slide-track" id="slideTrack">
        <div class="slide-track-label">确认进入休息时间</div>
        <div class="slide-track-target"></div>
        <div class="slide-thumb" id="slideThumb">确认进入休息时间</div>
      </div>
    </div>

    <!-- Dual-path rest borrow section (Case #6 restLocked variant) -->
    <div class="dual-path-section" id="dualPathBorrowSection">
      <div class="path-label">借用休息时间</div>
      <div class="path-body" id="dualPathBorrowBody">今天的休息时间已用完。继续休息使用需要向明天借用休息时间。</div>
      <div class="slide-confirm-wrap-composite" id="slideConfirmWrapBorrow">
        <div class="slide-hint" id="slideHintBorrow">向明天借用休息时间</div>
        <div class="slide-track" id="slideTrackBorrow">
          <div class="slide-track-label">向明天借用休息时间</div>
          <div class="slide-track-target"></div>
          <div class="slide-thumb" id="slideThumbBorrow">向明天借用休息时间</div>
        </div>
      </div>
    </div>

    <div id="statusFeedback"></div>

    <div class="footer"><span>TimeOnChrome</span> · 合理安排，高效成长</div>
  </div>

  <script src="reminder.js"></script>
</body>
</html>
