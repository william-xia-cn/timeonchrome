name = "guardian-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
NATIVE_APP_API_BASE_URL = "https://timeonchrome-native-app-api.william-xia-cn.workers.dev"
NATIVE_APP_BRIDGE_ISSUER = "guardian-api"

[[d1_databases]]
binding = "DB"
database_name = "guardian-db"
database_id = "5fa9f14b-9242-4996-96ed-35dd3024ba59"

[[r2_buckets]]
binding = "SESSION_FILES"
bucket_name = "guardian-sessions"

# 可选，配置缓存加速（如果创建了 KV 命名空间才启用）
[[kv_namespaces]]
binding = "CONFIG_CACHE"
id = "c9aac68bf121480f898564eb1b166295"

# Resend 邮件 API key（在 Cloudflare 控制台设置 secret，不要明文写在这里）
# wrangler secret put RESEND_API_KEY
# 邮件归类签名密钥、发布开关和 profile allowlist 均使用 secret，缺失时默认关闭
# wrangler secret put EMAIL_ACTION_SECRET
# wrangler secret put EMAIL_CLASSIFICATION_PROFILE_IDS
# wrangler secret put EMAIL_CLASSIFICATION_ENABLED

# Native App Control identity bridge (no Santa policy or enrollment data lives here)
# NATIVE_APP_API_BASE_URL = https://timeonchrome-native-app-api.william-xia-cn.workers.dev
# NATIVE_APP_BRIDGE_ISSUER = guardian-api
# wrangler secret put NATIVE_APP_TOKEN_PRIVATE_JWK

# 每 5 分钟处理邮件 outbox；每天 20:00 UTC+8 (12:00 UTC) 发送待审核提醒邮件
[triggers]
crons = ["*/5 * * * *", "0 12 * * *"]
