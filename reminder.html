<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提醒 - TimeOnChrome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0faf6;
      --card: #ffffff;
      --border: rgba(0, 184, 148, 0.12);
      --text: #1a2e25;
      --muted: #6b8a7a;
      --accent: #00b894;
      --green: #00b894;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 背景星点 */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(0, 184, 148, 0.4);
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--dur) var(--delay) infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: var(--max-op); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 48px 32px;
      max-width: 520px;
      width: 100%;
    }

    .icon-box {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, rgba(0, 184, 148, 0.1), rgba(0, 184, 148, 0.04));
      border: 1px solid rgba(0, 184, 148, 0.2);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      margin: 0 auto 28px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .domain-name {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: var(--accent);
      background: rgba(0, 184, 148, 0.08);
      padding: 4px 14px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 28px;
    }

    .custom-msg {
      font-size: 13px;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
      line-height: 1.4;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: #00a884;
      box-shadow: 0 2px 8px rgba(0, 184, 148, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(0, 184, 148, 0.25);
      background: rgba(0, 184, 148, 0.04);
    }
    .btn-secondary:hover {
      background: rgba(0, 184, 148, 0.1);
    }

    .btn-back {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-back:hover {
      background: rgba(0, 184, 148, 0.06);
      color: var(--text);
    }

    #statusFeedback {
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
      margin-bottom: 24px;
      transition: opacity 0.3s;
    }
    #statusFeedback.success { color: var(--accent); }
    #statusFeedback.error { color: var(--danger); }

    .footer {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .footer span { color: rgba(0, 184, 148, 0.7); }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="container">
    <div class="icon-box" id="mainIcon">🛡️</div>

    <h1 id="mainTitle">此网站不适合访问</h1>
    <p class="subtitle" id="subtitle">基于年龄和安全考虑，建议不要访问此类网站</p>
    <div class="domain-name" id="domainEl">-</div>

    <div class="custom-msg" id="customMsg" style="display: none;"></div>

    <div class="actions" id="actions">
      <button class="btn btn-back" onclick="history.back()">← 返回</button>
    </div>

    <div id="statusFeedback"></div>

    <div class="footer"><span>TimeOnChrome</span> · 合理安排，高效成长</div>
  </div>

  <script src="reminder.js"></script>
</body>
</html>
