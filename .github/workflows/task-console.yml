name: Task Console

on:
  pull_request:
    paths:
      - 'pages/task/**'
      - 'tests/manual/task-v1-pages-ui-smoke.mjs'
      - 'tests/fixtures/task-resource-canonical-v1.json'
      - 'package-lock.json'
      - '.github/workflows/task-console.yml'
  push:
    branches: [master]
    paths:
      - 'pages/task/**'
      - 'tests/manual/task-v1-pages-ui-smoke.mjs'
      - 'tests/fixtures/task-resource-canonical-v1.json'
      - 'package-lock.json'
      - '.github/workflows/task-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/manual/task-v1-pages-ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-console-mock-screenshots
          path: output/playwright/task-v1-cloud-*.png
          if-no-files-found: ignore
