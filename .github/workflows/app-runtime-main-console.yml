name: App Runtime Main Console Entry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pages/index.html'
      - 'pages/access-config-domains.js'
      - 'tests/unit/access-config-domains.test.js'
      - 'tests/unit/runtime-management-loader.test.js'
      - 'tests/unit/shared-access-management-view.test.js'
      - 'pages/composite-review.js'
      - 'tests/unit/composite-parent-console.test.js'
      - '.github/workflows/app-runtime-main-console.yml'
      - 'pages/_redirects'
      - 'tools/stage-main-console-release.js'
      - 'tests/unit/main-console-release-stage.test.js'
      - 'tests/unit/app-runtime-integration.test.js'
  push:
    branches: [master]
    paths:
      - 'pages/index.html'
      - 'pages/access-config-domains.js'
      - 'tests/unit/access-config-domains.test.js'
      - 'pages/_redirects'
      - 'tests/unit/shared-access-management-view.test.js'

jobs:
  launch-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/unit/app-runtime-integration.test.js
      - run: node tests/unit/composite-parent-console.test.js
      - run: node tests/unit/main-console-release-stage.test.js
      - run: node tests/unit/access-config-domains.test.js
      - run: node tests/unit/runtime-management-loader.test.js
      - run: node tests/unit/shared-access-management-view.test.js
