name: App Runtime Production

on:
  workflow_dispatch:
    inputs:
      deploy_runtime_worker:
        description: Deploy Runtime Worker
        type: boolean
        default: true
      deploy_runtime_pages:
        description: Deploy independent Runtime Pages
        type: boolean
        default: true
      deploy_guardian_worker:
        description: Deploy Guardian Worker (separate approval scope)
        type: boolean
        default: false
      deploy_main_pages:
        description: Deploy main console Pages (separate approval scope)
        type: boolean
        default: false
      bootstrap_computer_usage_rpc:
        description: First deployment only; requires both Runtime and Guardian Workers
        type: boolean
        default: false
      apply_runtime_migrations:
        description: Apply exactly the expected pending Runtime migrations
        type: boolean
        default: false
      expected_runtime_migrations:
        description: Comma-separated Runtime migration filenames expected to be pending
        type: string
        required: false
        default: ''
      defer_0011_macos_enrollment_hotfix:
        description: Approved exact-tree Worker-only release; retain 0011 unapplied
        type: boolean
        default: false

concurrency:
  group: app-runtime-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Release preflight
        env:
          BOOTSTRAP_COMPUTER_USAGE_RPC: ${{ inputs.bootstrap_computer_usage_rpc }}
          DEPLOY_BOTH_WORKERS: ${{ inputs.deploy_runtime_worker && inputs.deploy_guardian_worker }}
        run: |
          if [[ "$BOOTSTRAP_COMPUTER_USAGE_RPC" == true && "$DEPLOY_BOTH_WORKERS" != true ]]; then
            echo 'RPC bootstrap requires both Worker deployments' >&2
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production CLOUDFLARE_API_TOKEN secret' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing production CLOUDFLARE_ACCOUNT_ID variable' >&2; exit 1; }
          test -z "$(git status --porcelain)"
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git rev-parse origin/master)"
      - name: Exact SHA CI gates
        env:
          REQUIRE_RUNTIME_CI: ${{ inputs.deploy_runtime_worker || inputs.deploy_runtime_pages || inputs.apply_runtime_migrations }}
          REQUIRE_GUARDIAN_CI: ${{ inputs.deploy_guardian_worker }}
          REQUIRE_MAIN_CONSOLE_CI: ${{ inputs.deploy_main_pages }}
        run: |
          require_successful_workflow() {
            workflow="$1"
            label="$2"
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --status success --limit 20 --json headSha,conclusion)"
            RUNS_JSON="$runs" node -e '
              const runs = JSON.parse(process.env.RUNS_JSON || "[]");
              if (!runs.some((run) => run.headSha === process.env.GITHUB_SHA && run.conclusion === "success")) {
                console.error(`Missing successful ${process.argv[1]} gate for exact SHA ${process.env.GITHUB_SHA}`);
                process.exit(1);
              }
            ' "$label"
          }
          if [[ "$REQUIRE_RUNTIME_CI" == "true" ]]; then require_successful_workflow app-runtime.yml 'App Runtime'; fi
          if [[ "$REQUIRE_GUARDIAN_CI" == "true" ]]; then require_successful_workflow app-runtime-guardian-integration.yml 'Guardian integration'; fi
          if [[ "$REQUIRE_MAIN_CONSOLE_CI" == "true" ]]; then require_successful_workflow app-runtime-main-console.yml 'Main console'; fi
      - run: npm ci
      - run: npm ci --prefix app-runtime-management/backend
      - run: npm run build:app-runtime-contracts
      - name: Runtime migrations
        id: migrations
        if: inputs.deploy_runtime_worker || inputs.apply_runtime_migrations
        working-directory: app-runtime-management/backend
        env:
          EXPECTED_RUNTIME_MIGRATIONS: ${{ inputs.expected_runtime_migrations }}
          APPLY_RUNTIME_MIGRATIONS: ${{ inputs.apply_runtime_migrations }}
          DEFER_MACOS_HOTFIX: ${{ inputs.defer_0011_macos_enrollment_hotfix }}
          HOTFIX_WORKER_ONLY: ${{ inputs.deploy_runtime_worker && !inputs.deploy_runtime_pages && !inputs.deploy_guardian_worker && !inputs.deploy_main_pages }}
        run: |
          npx wrangler d1 migrations list timeonchrome-app-runtime --remote | tee pending-migrations.txt
          actual="$( { grep -oE '[0-9]{4}_[A-Za-z0-9_-]+\.sql' pending-migrations.txt || true; } | awk '!seen[$0]++' | paste -sd, -)"
          if [ "$actual" != "$EXPECTED_RUNTIME_MIGRATIONS" ]; then
            echo "Runtime migration gate mismatch: expected=$EXPECTED_RUNTIME_MIGRATIONS actual=$actual" >&2
            exit 1
          fi
          if [ -n "$actual" ] && [ "$APPLY_RUNTIME_MIGRATIONS" != true ]; then
            export ACTUAL_PENDING="$actual"
            export HOTFIX_BACKEND_TREE="$(git rev-parse HEAD:app-runtime-management/backend)"
            node -e '
              const e = process.env;
              const approvedBackendTrees = new Set([
                "20f790cb73feeef9d20852ff46edc0a6fec34b8f",
                "4d2f53b0fd0bea05da2a6afc6fbbf07dd2ad2bbb",
              ]);
              const allowed = e.DEFER_MACOS_HOTFIX === "true" && e.HOTFIX_WORKER_ONLY === "true"
                && e.APPLY_RUNTIME_MIGRATIONS === "false"
                && e.ACTUAL_PENDING === "0011_runtime_uninstall_operations.sql"
                && approvedBackendTrees.has(e.HOTFIX_BACKEND_TREE);
              if (!allowed) { console.error("Pending Runtime migrations require explicit apply authorization or exact approved hotfix"); process.exit(1); }
            '
            echo 'Approved exact-tree Worker-only release: 0011 remains unapplied' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$actual" ] && [ "$APPLY_RUNTIME_MIGRATIONS" = true ]; then
            npx wrangler d1 migrations apply timeonchrome-app-runtime --remote
            echo "applied=$actual" >> "$GITHUB_OUTPUT"
          fi
      - name: Runtime RPC bootstrap
        if: inputs.bootstrap_computer_usage_rpc && inputs.deploy_runtime_worker && inputs.deploy_guardian_worker
        working-directory: app-runtime-management/backend
        run: |
          # Publish the target entrypoint first without its new reverse binding.
          # Source SHA, other bindings, secrets, migrations and CI gates are unchanged.
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.main = path.resolve(config.main);
          delete config.$schema;
          config.services = (config.services || []).filter(binding => binding.binding !== 'GUARDIAN_COMPUTER_USAGE');
          for (const db of config.d1_databases || []) {
            if (db.migrations_dir) db.migrations_dir = path.resolve(db.migrations_dir);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'runtime-rpc-bootstrap.json'), JSON.stringify(config));
          NODE
          npx wrangler deploy --config "$RUNNER_TEMP/runtime-rpc-bootstrap.json"
      - name: Guardian Worker
        if: inputs.deploy_guardian_worker
        working-directory: app-runtime-management/backend
        run: npx wrangler deploy --config ../../workers/wrangler.toml
      - name: Runtime Worker
        if: inputs.deploy_runtime_worker
        working-directory: app-runtime-management/backend
        run: npx wrangler deploy
      - name: Runtime Pages
        if: inputs.deploy_runtime_pages
        working-directory: app-runtime-management/backend
        run: npx wrangler pages deploy ../console --project-name timeonchrome-app-runtime-console --branch master --commit-hash "${GITHUB_SHA}"
      - name: Main Pages
        if: inputs.deploy_main_pages
        working-directory: app-runtime-management/backend
        run: |
          stage="$RUNNER_TEMP/main-console-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node ../../tools/stage-main-console-release.js ../../pages "$stage"
          npx wrangler pages deploy "$stage" --project-name timeonchrome-console --branch master --commit-hash "${GITHUB_SHA}"
      - name: Runtime Worker smoke
        if: inputs.deploy_runtime_worker
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 --fail --silent --show-error \
            https://timeonchrome-app-runtime-api.william-xia-cn.workers.dev/v1/health > runtime-health.json
          status="$(curl --retry 5 --retry-all-errors --retry-delay 2 --silent --output /dev/null --write-out '%{http_code}' \
            'https://timeonchrome-app-runtime-api.william-xia-cn.workers.dev/v2/module/app-catalog?childId=ci-smoke')"
          test "$status" = "401"
      - name: Runtime Pages smoke
        if: inputs.deploy_runtime_pages
        run: curl --retry 5 --retry-all-errors --retry-delay 2 --fail --silent --show-error https://timeonchrome-app-runtime-console.pages.dev/ > /dev/null
      - name: Guardian fail-closed smoke
        if: inputs.deploy_guardian_worker
        run: |
          status="$(curl --retry 5 --retry-all-errors --retry-delay 2 --silent --output /dev/null --write-out '%{http_code}' \
            --request POST https://guardian-api.william-xia-cn.workers.dev/app-runtime/account-token)"
          test "$status" = "401"
      - name: Main Pages smoke
        if: inputs.deploy_main_pages
        run: curl --retry 5 --retry-all-errors --retry-delay 2 --fail --silent --show-error https://timeonchrome-console.pages.dev/ > /dev/null
      - name: Release manifest
        env:
          APPLIED_RUNTIME_MIGRATIONS: ${{ steps.migrations.outputs.applied }}
          DEPLOY_RUNTIME_WORKER: ${{ inputs.deploy_runtime_worker }}
          DEPLOY_RUNTIME_PAGES: ${{ inputs.deploy_runtime_pages }}
          DEPLOY_GUARDIAN_WORKER: ${{ inputs.deploy_guardian_worker }}
          DEPLOY_MAIN_PAGES: ${{ inputs.deploy_main_pages }}
        run: |
          (cd app-runtime-management/backend && npx wrangler deployments list --json) > runtime-worker-deployments.json
          (cd app-runtime-management/backend && npx wrangler deployments list --config ../../workers/wrangler.toml --json) > guardian-worker-deployments.json
          (cd app-runtime-management/backend && npx wrangler pages deployment list --project-name timeonchrome-app-runtime-console --environment production --json) > runtime-pages-deployments.json
          (cd app-runtime-management/backend && npx wrangler pages deployment list --project-name timeonchrome-console --environment production --json) > main-pages-deployments.json
          curl --fail --silent --show-error https://timeonchrome-app-runtime-api.william-xia-cn.workers.dev/v1/releases/windows/x64/latest > runtime-r2-latest.json
          node tools/write-app-runtime-release-manifest.js
      - uses: actions/upload-artifact@v4
        with:
          name: app-runtime-production-manifest-${{ github.sha }}
          path: app-runtime-production-manifest.json
